# Default instance configuration, written to /data/instance.yaml on first start if no
# configuration already exists there. Edit it on the host volume and restart the container to
# apply — it is never overwritten on later starts.
#
# Full field reference: user-docs/configuration-reference.md
#
# Every *_ref field is a NAME used to look up a credential (a .env variable name locally, or the
# env var an AWS Secrets Manager secret is injected as) — never a raw credential value.
# See configuration-docs/credentials-and-secrets.md.

personas: []                     # e.g. [Reviewer, TechLead] — one or more of:
                                 # CTO, Architect, TechLead, Reviewer, Intern,
                                 # DevSupport, Researcher, Librarian

model_host:
  provider: ""                   # one of: aws_bedrock | ollama_cloud | openrouter | anthropic | openai
  credentials_ref: ""            # e.g. MODEL_HOST_API_KEY

paperclip:
  agent_id: ""                   # must match this instance's agent registration in Paperclip —
                                 # see configuration-docs/paperclip-agent-registration.md.
                                 # Left empty, the instance starts but pulls no work.
  api_key_ref: ""                # e.g. PAPERCLIP_AGENT_API_KEY
  poll_schedule: ""              # cron expression for the work-pull job; empty = */5 * * * *

identity:
  github_bot_account_ref: ""     # e.g. GITHUB_PAT (see configuration-docs/github-cli-and-pat.md)
