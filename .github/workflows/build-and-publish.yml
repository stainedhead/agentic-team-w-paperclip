name: Build and Publish Images

# Builds both container image variants (FR-016) and publishes them to GHCR (FR-030); cuts a
# GitHub Release on a tag push (FR-031). See
# specs/archive/260927-agentic-team-w-paperclip/architecture.md for why the paperclip image is built
# FROM the harness image (pinned by digest, not a mutable tag, to avoid a race between the two
# builds landing on the registry).

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  HARNESS_IMAGE: ${{ github.repository }}/harness
  PAPERCLIP_IMAGE: ${{ github.repository }}/paperclip

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for harness image
        id: meta-harness
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.HARNESS_IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push harness image
        id: build-harness
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/harness/Dockerfile
          push: true
          tags: ${{ steps.meta-harness.outputs.tags }}
          labels: ${{ steps.meta-harness.outputs.labels }}

      - name: Extract metadata for paperclip image
        id: meta-paperclip
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PAPERCLIP_IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push paperclip image (FROM harness image, pinned by digest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/paperclip/Dockerfile
          push: true
          tags: ${{ steps.meta-paperclip.outputs.tags }}
          labels: ${{ steps.meta-paperclip.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.HARNESS_IMAGE }}@${{ steps.build-harness.outputs.digest }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
