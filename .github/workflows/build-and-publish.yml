name: Build and Publish Images

# Builds both container image variants and publishes them to GHCR; semver-tags them when a
# GitHub Release is published. See documentation/technical-architecture.md for why the paperclip
# image is built FROM the harness image (pinned by digest, not a mutable tag, to avoid a race
# between the two builds landing on the registry).
#
# Build context note: each image's `context:` is its own directory under images/, NOT the repo
# root. The Dockerfiles `COPY` their sidecar files (instance.default.yaml, harness-bootstrap.sh,
# entrypoint.sh) by bare filename, which only resolves if the context is the directory those
# files live in. This also means `docker build images/harness` works locally exactly as CI does.
#
# Trigger note: only `push: branches: [main]` and `release: types: [published]` publish — a bare
# `tags: [...]` push is intentionally NOT a separate trigger, since publishing a release also
# fires on the tag it's cut from, and having both would double-build/double-publish. Pull requests
# run the lint and smoke-build gates but never push to the registry.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  HARNESS_IMAGE: ${{ github.repository }}/harness
  PAPERCLIP_IMAGE: ${{ github.repository }}/paperclip
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  lint:
    # Validate the Dockerfiles and shell scripts before building images from them — this is
    # exactly the class of bug (a shell logic error, a Dockerfile step that's a no-op) a linter
    # catches before merge.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shellcheck all shell scripts
        # Both entrypoints source harness-bootstrap.sh by its in-container absolute path, which does
        # not exist at lint time — an SC1091 failure on its own. `-x` makes shellcheck follow the
        # `# shellcheck source=` directives in those files, and `--source-path=SCRIPTDIR` resolves
        # those directives relative to each script's own directory rather than the current working
        # directory, so this works from anywhere. The result is stronger than merely silencing
        # SC1091: shellcheck analyses the sourced file in the context of each caller.
        run: |
          shellcheck -x --source-path=SCRIPTDIR \
                     images/harness/harness-bootstrap.sh \
                     images/harness/entrypoint.sh \
                     images/paperclip/entrypoint.sh \
                     templates/macos-container/run-instance.sh

      - name: Hadolint harness Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: images/harness/Dockerfile

      - name: Hadolint paperclip Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: images/paperclip/Dockerfile

  smoke-build:
    # Single-arch (amd64, no QEMU) build of both images that is actually run, to verify the things
    # static analysis cannot: that the tool installers succeed, that their binaries are still on PATH
    # after the image drops to the non-root agent user, and that the instance.yaml bootstrap writes a
    # config to /data.
    #
    # Images go to a throwaway registry on localhost rather than the daemon's image store, because
    # buildx runs the build inside its own container and cannot see images `docker load`ed into the
    # host daemon — so the paperclip build could not resolve the harness image as its base and tried
    # to pull it from Docker Hub. The registry lives and dies with this job; nothing leaves it.
    needs: lint
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      LOCAL_REGISTRY: localhost:5000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        # network=host lets the builder container reach the registry service on localhost:5000.
        # BuildKit and the Docker daemon both treat localhost registries as insecure/HTTP by default,
        # so no extra registry configuration is needed.
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build harness image (amd64, to the local registry)
        uses: docker/build-push-action@v6
        with:
          context: images/harness
          platforms: linux/amd64
          push: true
          tags: ${{ env.LOCAL_REGISTRY }}/harness:smoke
          cache-from: type=gha,scope=harness
          cache-to: type=gha,scope=harness,mode=max

      - name: Verify harness image runtime
        run: |
          set -euo pipefail
          # Runs as the image's own USER (agent) with the image's own ENV, so this checks the
          # post-privilege-drop PATH, not root's.
          docker run --rm --entrypoint /bin/bash "${LOCAL_REGISTRY}/harness:smoke" -c '
            set -euo pipefail
            echo "whoami=$(whoami) uid=$(id -u) HOME=${HOME}"
            [ "$(id -u)" = "1000" ] || { echo "FAIL: image is not running as uid 1000"; exit 1; }
            for tool in hermes omp opencode yq gh git; do
              if command -v "${tool}" >/dev/null 2>&1; then
                echo "ok: ${tool} -> $(command -v "${tool}")"
              else
                echo "FAIL: ${tool} is not on PATH after dropping to the agent user"
                exit 1
              fi
            done
          '

      - name: Verify instance.yaml bootstrap writes a default config
        run: |
          set -euo pipefail
          # Source the bootstrap directly rather than running the entrypoint, which would exec
          # into the Hermes gateway and block. The default template has an empty paperclip.agent_id,
          # so the cron-create branch is correctly skipped.
          docker run --rm --entrypoint /bin/bash "${LOCAL_REGISTRY}/harness:smoke" -c '
            set -euo pipefail
            source /opt/agentic-team/harness-bootstrap.sh
            test -f /data/instance.yaml || { echo "FAIL: /data/instance.yaml was not bootstrapped"; exit 1; }
            echo "ok: bootstrapped /data/instance.yaml"
            test -f "${HOME}/.hermes/.env" || { echo "FAIL: ${HOME}/.hermes/.env was not written"; exit 1; }
            echo "ok: wrote ${HOME}/.hermes/.env"
          '

      - name: Build paperclip image (amd64, FROM the harness image just built)
        uses: docker/build-push-action@v6
        with:
          context: images/paperclip
          platforms: linux/amd64
          push: true
          tags: ${{ env.LOCAL_REGISTRY }}/paperclip:smoke
          build-args: |
            BASE_IMAGE=${{ env.LOCAL_REGISTRY }}/harness:smoke
          cache-from: type=gha,scope=paperclip
          cache-to: type=gha,scope=paperclip,mode=max

      - name: Verify paperclip image runtime
        run: |
          set -euo pipefail
          # npx is a hard runtime dependency: Paperclip's CLI is invoked as `npx paperclipai <verb>`,
          # so the entrypoint fails fast without it. Whether paperclip.ing/install.sh brings its own
          # Node is not documented upstream — this step is what answers that, at build time rather
          # than at a swarm owner's deploy time. If it fails, add Node to images/paperclip/Dockerfile.
          docker run --rm --entrypoint /bin/bash "${LOCAL_REGISTRY}/paperclip:smoke" -c '
            set -euo pipefail
            [ "$(id -u)" = "1000" ] || { echo "FAIL: image is not running as uid 1000"; exit 1; }
            for tool in hermes omp opencode openssl; do
              command -v "${tool}" >/dev/null 2>&1 || { echo "FAIL: ${tool} missing"; exit 1; }
              echo "ok: ${tool}"
            done
            if command -v npx >/dev/null 2>&1; then
              echo "ok: npx -> $(command -v npx)"
            else
              echo "FAIL: npx is not on PATH, but the entrypoint invokes Paperclip as \"npx paperclipai\"."
              echo "      Paperclip cannot start in this image. Install Node.js in images/paperclip/Dockerfile."
              exit 1
            fi
          '

  build-and-publish:
    needs: [lint, smoke-build]
    # Pull requests exercise the gates above but must never publish to the registry.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for linux/arm64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for harness image
        id: meta-harness
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.HARNESS_IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push harness image (multi-arch)
        id: build-harness
        uses: docker/build-push-action@v6
        with:
          context: images/harness
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta-harness.outputs.tags }}
          labels: ${{ steps.meta-harness.outputs.labels }}
          cache-from: type=gha,scope=harness-multiarch
          cache-to: type=gha,scope=harness-multiarch,mode=max

      - name: Extract metadata for paperclip image
        id: meta-paperclip
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PAPERCLIP_IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push paperclip image (multi-arch, FROM harness image pinned by digest)
        uses: docker/build-push-action@v6
        with:
          context: images/paperclip
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta-paperclip.outputs.tags }}
          labels: ${{ steps.meta-paperclip.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.HARNESS_IMAGE }}@${{ steps.build-harness.outputs.digest }}
          cache-from: type=gha,scope=paperclip-multiarch
          cache-to: type=gha,scope=paperclip-multiarch,mode=max

# Note: there is deliberately no separate "create a release" job here. CI/CD supports cutting
# GitHub Releases by reacting correctly to a release a maintainer publishes (via the GitHub UI or
# `gh release create`) — the `release: types: [published]` trigger above builds and semver-tags
# images for it. A prior version of this workflow also tried to *create* the release from a bare
# tag push, which both duplicated this job and was redundant once triggered by `release:
# published`, since the release already exists by that point.
