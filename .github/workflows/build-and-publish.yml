name: Build and Publish Images

# Builds both container image variants for linux/amd64 and linux/arm64 and publishes them to GHCR;
# semver-tags them when a GitHub Release is published.
#
# ── Why one job per architecture ──────────────────────────────────────────────────────────────
# Each architecture is built on a runner of that architecture, in parallel, and the two results are
# then merged into a single multi-arch manifest per image. This replaces building arm64 under QEMU
# emulation on an amd64 runner, which was punishingly slow here: every tool in these images installs
# by downloading and bootstrapping its own runtime (uv/Python for Hermes, a Node toolchain, prebuilt
# binaries), and all of that ran emulated. GitHub's native arm64 runners are free for public
# repositories, so no emulation is needed at all.
#
# There is still exactly ONE Dockerfile per image. The split is in CI only — per-architecture
# Dockerfiles would duplicate every maintenance change and defeat the point of the paperclip image
# being built FROM the harness image (see ADR-0006).
#
# ── Build context ─────────────────────────────────────────────────────────────────────────────
# Each image's `context:` is its own directory under images/, NOT the repo root: the Dockerfiles
# COPY their sidecar files by bare filename, which only resolves if the context is the directory
# those files live in. `docker build images/harness` therefore works locally exactly as CI does.
#
# ── Triggers ──────────────────────────────────────────────────────────────────────────────────
# Only `push: branches: [main]` and `release: types: [published]` publish. A bare `tags: [...]` push
# is intentionally not a separate trigger, since publishing a release also fires on the tag it is cut
# from and both would double-publish. Pull requests run the lint and smoke-build gates only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch: {}

# Serialize runs per ref so two pushes landing close together cannot race over the same tags.
# Without this, a second merge starts while the first is still publishing, and whichever finishes last
# wins `:latest` — which may be the OLDER commit. Observed for real: merging two PRs ~35 minutes apart
# left two publish runs in flight simultaneously.
#
# cancel-in-progress is safe here specifically because per-architecture builds push BY DIGEST and only
# the merge job applies tags: a cancelled run leaves at most some untagged blobs, which are unreferenced
# and harmless, never a half-updated tag. Release events get their own group (the ref is the tag), so a
# release publish is never cancelled by a push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  HARNESS_IMAGE: ${{ github.repository }}/harness
  PAPERCLIP_IMAGE: ${{ github.repository }}/paperclip

jobs:
  lint:
    # Validate the Dockerfiles and shell scripts before building images from them — exactly the class
    # of bug (a shell logic error, a Dockerfile step that is a no-op) a linter catches before merge.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shellcheck all shell scripts
        # Both entrypoints source harness-bootstrap.sh by its in-container absolute path, which does
        # not exist at lint time — an SC1091 failure on its own. `-x` makes shellcheck follow the
        # `# shellcheck source=` directives in those files, and `--source-path=SCRIPTDIR` resolves
        # them relative to each script's own directory rather than the current working directory.
        # Stronger than merely silencing SC1091: shellcheck analyses the sourced file in context.
        run: |
          shellcheck -x --source-path=SCRIPTDIR \
                     images/harness/harness-bootstrap.sh \
                     images/harness/poll-job.sh \
                     images/harness/entrypoint.sh \
                     images/paperclip/start-mode.sh \
                     images/paperclip/entrypoint.sh \
                     templates/macos-container/run-instance.sh \
                     tests/startup_test.sh

      - name: Test startup helpers
        run: bash tests/startup_test.sh

      - name: Hadolint harness Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: images/harness/Dockerfile

      - name: Hadolint paperclip Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: images/paperclip/Dockerfile

  smoke-build:
    # Builds both images for ONE architecture and actually runs them, asserting what static analysis
    # cannot: that the tool installers succeed, that their binaries are still on PATH after the image
    # drops to the non-root agent user, and that the instance.yaml bootstrap writes a config. Runs
    # natively on each architecture, so arm64 — the architecture Apple Silicon lab machines and AWS
    # Graviton both use — is verified rather than assumed.
    #
    # Images go to a throwaway registry on localhost rather than the daemon's image store, because
    # buildx builds inside its own container and cannot see images `docker load`ed into the host
    # daemon — the paperclip build would otherwise try Docker Hub for its base. The registry dies
    # with the job.
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      LOCAL_REGISTRY: localhost:5000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        # network=host lets the builder container reach the registry service on localhost:5000.
        # BuildKit and the Docker daemon both treat localhost registries as insecure/HTTP by default.
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build harness image (${{ matrix.arch }}, to the local registry)
        uses: docker/build-push-action@v6
        with:
          context: images/harness
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.LOCAL_REGISTRY }}/harness:smoke
          cache-from: type=gha,scope=harness-${{ matrix.arch }}
          cache-to: type=gha,scope=harness-${{ matrix.arch }},mode=max

      - name: Verify harness image runtime
        run: |
          set -euo pipefail
          # Runs as the image's own USER (agent) with the image's own ENV, so this checks the
          # post-privilege-drop PATH, not root's.
          docker run --rm --entrypoint /bin/bash "${LOCAL_REGISTRY}/harness:smoke" -c '
            set -euo pipefail
            echo "arch=$(uname -m) whoami=$(whoami) uid=$(id -u) HOME=${HOME}"
            [ "$(id -u)" = "1000" ] || { echo "FAIL: image is not running as uid 1000"; exit 1; }
            for tool in hermes omp opencode yq jq gh git; do
              if command -v "${tool}" >/dev/null 2>&1; then
                echo "ok: ${tool} -> $(command -v "${tool}")"
              else
                echo "FAIL: ${tool} is not on PATH after dropping to the agent user"
                exit 1
              fi
            done
          '

      - name: Verify instance.yaml bootstrap writes a default config
        run: |
          set -euo pipefail
          # Source the bootstrap rather than running the entrypoint, which would exec into the Hermes
          # gateway and block. The default template has an empty paperclip.agent_id, so the
          # cron-create branch is correctly skipped.
          docker run --rm --entrypoint /bin/bash "${LOCAL_REGISTRY}/harness:smoke" -c '
            set -euo pipefail
            source /opt/agentic-team/harness-bootstrap.sh
            test -f /data/instance.yaml || { echo "FAIL: /data/instance.yaml was not bootstrapped"; exit 1; }
            echo "ok: bootstrapped /data/instance.yaml"
            test -f "${HOME}/.hermes/.env" || { echo "FAIL: ${HOME}/.hermes/.env was not written"; exit 1; }
            echo "ok: wrote ${HOME}/.hermes/.env"
          '

      - name: Build paperclip image (${{ matrix.arch }}, FROM the harness image just built)
        uses: docker/build-push-action@v6
        with:
          context: images/paperclip
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.LOCAL_REGISTRY }}/paperclip:smoke
          build-args: |
            BASE_IMAGE=${{ env.LOCAL_REGISTRY }}/harness:smoke
          cache-from: type=gha,scope=paperclip-${{ matrix.arch }}
          cache-to: type=gha,scope=paperclip-${{ matrix.arch }},mode=max

      - name: Verify paperclip image runtime
        run: |
          set -euo pipefail
          # npx is a hard runtime dependency: Paperclip's CLI is invoked as `npx paperclipai <verb>`,
          # so the entrypoint fails fast without it. Paperclip does not bundle Node, so the image
          # installs it (see ADR-0015) — this asserts that actually worked, per architecture.
          docker run --rm --entrypoint /bin/bash "${LOCAL_REGISTRY}/paperclip:smoke" -c '
            set -euo pipefail
            echo "arch=$(uname -m) uid=$(id -u)"
            [ "$(id -u)" = "1000" ] || { echo "FAIL: image is not running as uid 1000"; exit 1; }
            for tool in hermes omp opencode openssl node npm npx; do
              command -v "${tool}" >/dev/null 2>&1 \
                || { echo "FAIL: ${tool} is not on PATH"; exit 1; }
              echo "ok: ${tool} -> $(command -v "${tool}")"
            done
            echo "node $(node --version), npm $(npm --version)"
            command -v paperclipai >/dev/null 2>&1 \
              && echo "ok: paperclipai -> $(command -v paperclipai)" \
              || echo "note: no paperclipai shim on PATH; the entrypoint invokes it via npx"
          '

  # ── Publish ─────────────────────────────────────────────────────────────────────────────────
  # Each image is built per architecture and pushed BY DIGEST only (no tag), then a merge job
  # assembles the per-arch digests into one tagged multi-arch manifest. Pushing by digest is what
  # lets two parallel jobs contribute to the same image without racing over a shared tag.

  build-harness:
    needs: [lint, smoke-build]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels only; tags are applied by the merge job)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.HARNESS_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: images/harness
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.HARNESS_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=harness-${{ matrix.arch }}
          cache-to: type=gha,scope=harness-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-harness-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-harness:
    needs: build-harness
    runs-on: ubuntu-latest
    outputs:
      # The multi-arch manifest digest, used to pin the paperclip image's base (ADR-0006). Pinning to
      # the manifest rather than one architecture's image means each paperclip arch build resolves the
      # matching harness arch automatically.
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-harness-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.HARNESS_IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # One `-t` per tag from metadata-action, and one source ref per per-arch digest file.
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf "${REGISTRY}/${HARNESS_IMAGE}@sha256:%s " *)

      - name: Capture manifest digest
        id: manifest
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect \
            "${REGISTRY}/${HARNESS_IMAGE}:sha-${GITHUB_SHA}" \
            --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "harness manifest digest: ${digest}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Report
        run: |
          docker buildx imagetools inspect "${REGISTRY}/${HARNESS_IMAGE}:sha-${GITHUB_SHA}"

  build-paperclip:
    needs: merge-harness
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels only; tags are applied by the merge job)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PAPERCLIP_IMAGE }}

      - name: Build and push by digest (FROM the harness manifest, digest-pinned)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: images/paperclip
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.HARNESS_IMAGE }}@${{ needs.merge-harness.outputs.digest }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.PAPERCLIP_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=paperclip-${{ matrix.arch }}
          cache-to: type=gha,scope=paperclip-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-paperclip-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-paperclip:
    needs: build-paperclip
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-paperclip-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PAPERCLIP_IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf "${REGISTRY}/${PAPERCLIP_IMAGE}@sha256:%s " *)

      - name: Report
        run: |
          docker buildx imagetools inspect "${REGISTRY}/${PAPERCLIP_IMAGE}:sha-${GITHUB_SHA}"

# Note: there is deliberately no separate "create a release" job. CI/CD supports cutting GitHub
# Releases by reacting correctly to a release a maintainer publishes (via the UI or
# `gh release create`) — the `release: types: [published]` trigger semver-tags images for it. An
# earlier version also tried to *create* the release from a bare tag push, which duplicated the build
# and was redundant once triggered by `release: published`, since the release already exists by then.
